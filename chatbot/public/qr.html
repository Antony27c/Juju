<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>QR del Pasaporte · juju</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Plus+Jakarta+Sans:wght@400..800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" integrity="sha384-mZT2gIty7ZDdOGkxfP6joZcYdMW1Jvj9dRlfpTmaJAKKXTqzygtB22k7FLe+KZC1" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
  /* Printable sheet for the organizers: one card per stop, to stick at the place. Always light: it goes on paper. */
  :root { --suelo: #f5f4f0; --papel: #fff; --hueco: #eeece6; --tinta: #15172b; --tenue: #5a6077; --linea: #e3e1da; --acento: #c2185b; --no: #b3261e; --duda: #8a6100;
    --f1: #cf1c6b; --f2: #b5202e; --f3: #e56a1c; --f4: #edb21f; --f5: #2c8a4d; --f6: #1397a6; --f7: #5d3fa6;
    --texto: "Plus Jakarta Sans", system-ui, "Segoe UI", Roboto, Arial, sans-serif; --pixel: "Pixelify Sans", ui-monospace, Consolas, monospace; color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--suelo); color: var(--tinta); font: 400 15px/1.45 var(--texto); }
  .barra { max-width: 1080px; margin: 0 auto; padding: 18px 16px 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
  .barra h1 { margin: 0; font: 700 26px/1 var(--pixel); }
  .barra p { margin: 0; color: var(--tenue); flex-basis: 100%; }
  .barra button { margin-left: auto; height: 38px; padding: 0 16px; border-radius: 999px; border: 0; background: var(--acento); color: #fff; font: 650 14px var(--texto); cursor: pointer; }
  .aviso { max-width: 1080px; margin: 6px auto 0; padding: 10px 16px; color: var(--duda); font-weight: 600; }
  .aviso.mal { color: var(--no); }
  .hojas { max-width: 1080px; margin: 0 auto; padding: 12px 16px 32px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .cartel { break-inside: avoid; page-break-inside: avoid; background: var(--papel); border: 1px solid var(--linea); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
  .cartel .faja { height: 10px; background: var(--c); }
  .cartel .dentro { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 6px; align-items: center; text-align: center; }
  .rotulo { font: 500 13px/1 var(--pixel); letter-spacing: .06em; text-transform: uppercase; color: var(--tenue); }
  .cartel h2 { margin: 2px 0 0; font-size: 21px; font-weight: 750; line-height: 1.15; letter-spacing: -.02em; }
  .cartel .donde { color: var(--tenue); font-size: 14px; }
  .qr { width: 210px; height: 210px; margin: 8px 0 4px; }
  .qr svg { width: 100%; height: 100%; display: block; }
  .instr { font-size: 14px; font-weight: 600; max-width: 26ch; }
  .codigo { font: 500 11px/1.2 ui-monospace, Consolas, monospace; color: var(--tenue); word-break: break-all; }
  .marca { font: 700 18px/1 var(--pixel); margin-top: 4px; }
  @media print {
    body { background: #fff; }
    .barra button, .aviso { display: none; }
    .hojas { grid-template-columns: 1fr 1fr; gap: 10mm; padding: 0; }
    .cartel { border-color: #bbb; }
    @page { size: A4; margin: 12mm; }
  }
</style>
</head>
<body>
  <header class="barra">
    <h1>juju · QR del Pasaporte</h1>
    <button type="button" id="imprimir">Imprimir</button>
    <p>Un cartel por parada. Pegalo en el lugar: al escanearlo, el turista suma el sello a su pasaporte.</p>
  </header>
  <p class="aviso" id="aviso" hidden role="status"></p>
  <main class="hojas" id="hojas" aria-live="polite"></main>
<script>
const $ = (id) => document.getElementById(id);
function nodo(tag, clase, texto) { const n = document.createElement(tag); if (clase) n.className = clase; if (texto != null) n.textContent = texto; return n; }
function aviso(texto, mal) { $('aviso').textContent = texto; $('aviso').className = 'aviso' + (mal ? ' mal' : ''); $('aviso').hidden = false; }
$('imprimir').onclick = () => window.print();

(async () => {
  const clave = new URLSearchParams(location.search).get('clave');
  const r = await fetch('/api/pasaporte/qr' + (clave ? `?clave=${encodeURIComponent(clave)}` : '')).catch(() => null);
  const d = r ? await r.json().catch(() => ({})) : {};
  if (!r || !r.ok) return aviso(d.error || 'No hay conexión con el servidor de juju.', true);
  if (typeof qrcode !== 'function') return aviso('No se pudo cargar el generador de QR. Revisá la conexión a internet.', true);
  if (!d.secreto_fijo) aviso('Ojo: PASAPORTE_SECRETO no está configurado en el servidor. Si se reinstala, estos QR dejan de valer: configuralo antes de imprimirlos.');
  for (const p of d.paradas) {
    const q = qrcode(0, 'M'); q.addData(p.url); q.make();
    const c = nodo('article', 'cartel'); c.style.setProperty('--c', `var(--${p.color})`);
    const dentro = nodo('div', 'dentro');
    const caja = nodo('div', 'qr'); caja.innerHTML = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true, title: `QR de ${p.nombre}` });
    dentro.append(nodo('span', 'rotulo', 'Pasaporte de Jujuy'), nodo('h2', '', p.nombre), nodo('span', 'donde', `${p.localidad} · ${p.region}`), caja,
      nodo('p', 'instr', 'Escaneá con la cámara del celular y sumá este sello a tu pasaporte.'), nodo('span', 'codigo', p.url), nodo('span', 'marca', 'juju'));
    c.append(nodo('div', 'faja'), dentro);
    $('hojas').append(c);
  }
})();
</script>
</body>
</html>
